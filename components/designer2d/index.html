<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive kitchen floor plan</title>
<style>body{margin:0;font:14px system-ui;color:#15304a;background:#fff}#tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px}button{padding:8px 12px;border:1px solid #bccbd6;border-radius:8px;background:#f4f6f8;color:#18344b;cursor:pointer}button:disabled{opacity:.5;cursor:default}#plan{width:100%;height:540px;background:#f7f9fb;touch-action:none;outline:none;border:1px solid #c8d2da;box-sizing:border-box}polygon.unit{cursor:grab;stroke:#385b74;stroke-width:8}polygon.selected{stroke:#b18131;stroke-width:16}#status{padding:8px;min-height:20px}text{pointer-events:none;user-select:none}.locked polygon.unit{cursor:default}
#studio{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
#drawing{min-width:0}#palette{background:#f1f5f8;border:1px solid #d6e0e8;border-radius:10px;align-content:start;box-sizing:border-box;max-height:650px;overflow-y:auto}
#palette button{width:100%;text-align:left;background:#fff}#palette button:hover{border-color:#b18131;background:#fbf8f1}
#palette strong{padding:6px 3px;line-height:1.5}#plan{height:600px;border-radius:8px}#tools{padding:0 0 10px}#help{font-size:12px;color:#52677a}#selection{padding:10px 0;font-size:13px;color:#173b57;min-height:20px}
.wall-mode #studio{display:block}.wall-mode #palette{background:none;border:none;max-height:none;overflow:visible}.wall-mode #palette button{width:auto}.wall-mode #selection{display:none}.wall-mode #plan{height:540px}
@media(max-width:800px){#studio{grid-template-columns:170px minmax(0,1fr)}#palette{font-size:12px}#palette button{font-size:12px;padding:8px}#plan{height:540px}}
@media(max-width:580px){#studio{display:block}#palette{max-height:180px;margin-bottom:12px}#palette button{width:auto}}
</style>
<div id="studio"><div id="palette" style="padding:8px;display:flex;gap:8px;flex-wrap:wrap" aria-label="Cabinet library"></div>
<div id="drawing"><div id="tools"><button id="rotate" disabled>Rotate 90°</button><button id="delete" disabled>Delete selected</button><span id="help">Click a unit to select; drag to move. Arrow keys: 10 mm, Shift: 1 mm.</span></div>
<div id="selection" role="status"></div><svg id="plan" tabindex="0" role="application" aria-label="Interactive kitchen floor plan"></svg><div id="status" role="status" aria-live="polite">Loading plan…</div></div></div>
<script>
let args=null,selected=null,drag=null,pending=false,wallStart=null,wallDrag=null,wallTool='select';
const svg=document.getElementById('plan'),ns='http://www.w3.org/2000/svg';
function post(type,data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function element(tag,attrs,text){let el=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;svg.appendChild(el);return el}
function points(row){let a=row['Rotation (deg)']*Math.PI/180,c=Math.cos(a),s=Math.sin(a),x=row['X (mm)'],y=row['Y (mm)'],w=row['Width (mm)'],d=row['Depth (mm)'];return [[0,0],[w,0],[w,d],[0,d]].map(([u,v])=>[x+u*c-v*s,y+u*s+v*c])}
function position(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function selectedRow(){return args.units.find(u=>u.index===selected)}
function send(action,extra={}){if(!args||pending||(args.locked&&action!=='select'))return;pending=true;post('streamlit:setComponentValue',{value:{id:window.crypto?.randomUUID?window.crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),action,index:selected,revision:args.revision,...extra}});buttons();document.getElementById('status').textContent='Applying change…'}
function palette(){document.body.classList.toggle('wall-mode',args.mode==='walls');let root=document.getElementById('palette');root.replaceChildren();document.getElementById('tools').style.display=args.mode==='walls'?'none':'flex';if(args.mode==='walls'){let text=document.createElement('strong');text.textContent=`Room height ${args.layout.height} mm. Walls are locked by default; click a wall to select it; use Correct wall position, or unlock to drag.`;text.style.width='100%';root.appendChild(text);for(let [value,label] of [['select','Move unlocked walls'],['draw','Draw wall']]){let button=document.createElement('button');button.textContent=label;button.onclick=()=>{wallTool=value;wallStart=null;draw();document.getElementById('status').textContent=value==='draw'?'Click the wall start and end.':'Drag an unlocked wall or either endpoint.'};root.appendChild(button)}return;}let label=document.createElement('strong');label.textContent=`${Object.keys(args.library||{}).length} cabinet types · ${args.units.length} placed units — drag or click Add:`;label.style.width='100%';root.appendChild(label);for(let [kind,spec] of Object.entries(args.library||{})){let chip=document.createElement('button');chip.textContent=`Add ${kind}`;chip.title=`${spec.width} × ${spec.depth} mm; ${spec.category}`;chip.disabled=args.locked;chip.draggable=!args.locked;chip.dataset.kind=kind;chip.onclick=()=>send('add',{unit_type:kind});chip.addEventListener('dragstart',e=>{if(args.locked||pending){e.preventDefault();return}e.dataTransfer.setData('text/plain',kind);e.dataTransfer.effectAllowed='copy'});root.appendChild(chip)}}
svg.addEventListener('dragover',e=>{if(args&&!args.locked&&!pending){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
svg.addEventListener('drop',e=>{e.preventDefault();if(!args||args.locked||pending)return;let kind=e.dataTransfer.getData('text/plain'),spec=args.library?.[kind];if(!spec)return;let p=position(e);send('add',{unit_type:kind,x:p.x-spec.width/2,y:p.y-spec.depth/2})});
function buttons(){for(let chip of document.querySelectorAll('#palette button'))chip.disabled=args.locked||pending;let blocked=!selectedRow()||args.locked||pending;document.getElementById('rotate').disabled=blocked;document.getElementById('delete').disabled=blocked}
function draw(){let active=selectedRow()?.row;document.getElementById('selection').textContent=active?`${active.Name} · ${active['Width (mm)']} W × ${active['Depth (mm)']} D × ${active['Height (mm)']} H mm · X ${active['X (mm)']} / Y ${active['Y (mm)']} / Z ${active['Z (mm)']} mm`:'Select a unit to inspect its measurements';svg.replaceChildren();let L=args.layout.length,D=args.layout.width,F=Math.max(L,D)/65;svg.setAttribute('viewBox',`${-F*5} ${-F*4} ${L+F*10} ${D+F*8}`);svg.classList.toggle('locked',args.locked);
 let defs=element('defs',{}),pat=document.createElementNS(ns,'pattern');pat.id='grid';pat.setAttribute('width','100');pat.setAttribute('height','100');pat.setAttribute('patternUnits','userSpaceOnUse');let path=document.createElementNS(ns,'path');path.setAttribute('d','M 100 0 L 0 0 0 100');path.setAttribute('fill','none');path.setAttribute('stroke','#e1e5e5');path.setAttribute('stroke-width','2');pat.appendChild(path);defs.appendChild(pat);
 element('rect',{x:0,y:0,width:L,height:D,fill:'url(#grid)',stroke:'#15304a','stroke-width':12});
 element('text',{x:L/2,y:-F*1.7,'text-anchor':'middle','font-size':F*1.5},`FRONT — ${L} mm`);element('text',{x:L/2,y:D+F*2.2,'text-anchor':'middle','font-size':F*1.5},`BACK — room depth ${D} mm`);
 element('text',{x:-F*4.5,y:D/2,'font-size':F*1.5},'LEFT');element('text',{x:L+F*.5,y:D/2,'font-size':F*1.5},'RIGHT');
 for(let o of args.layout.openings){let off=o['Offset (mm)'],w=o['Width (mm)'],wall=o.Wall,x1,y1,x2,y2;if(wall==='Front'||wall==='Back'){x1=off;x2=off+w;y1=y2=wall==='Front'?0:D}else{y1=off;y2=off+w;x1=x2=wall==='Left'?0:L}element('line',{x1,y1,x2,y2,stroke:o.Type==='Door'?'#b18131':'#258fca','stroke-width':28});}
 for(let [index,original] of (args.layout.walls||[]).entries()){let wall=wallDrag?.index===index?wallDrag.preview:original,unlocked=wall.Locked===false,line=element('line',{x1:wall['Start X (mm)'],y1:wall['Start Y (mm)'],x2:wall['End X (mm)'],y2:wall['End Y (mm)'],stroke:args.mode==='walls'&&index===args.selected?'#b18131':unlocked?'#258fca':'#697b8b','stroke-width':wall['Thickness (mm)'],'data-wall':index});
 if(args.mode==='walls'){element('text',{x:(wall['Start X (mm)']+wall['End X (mm)'])/2,y:(wall['Start Y (mm)']+wall['End Y (mm)'])/2-F*1.4,'text-anchor':'middle','font-size':F*1.3,fill:'#173b57'},`${index+1}: ${wall.Name}`);let startDrag=(e,part)=>{if(wallTool==='draw')return;e.stopPropagation();if(pending)return;if(!unlocked){selected=index;send('wall_select');return}e.preventDefault();let p=position(e);wallDrag={index,part,start:p,original:{...original},preview:{...original}};svg.setPointerCapture(e.pointerId)};line.addEventListener('pointerdown',e=>startDrag(e,'move'));
 if(unlocked&&wallTool==='select'){for(let part of ['start','end']){let prefix=part==='start'?'Start':'End',handle=element('circle',{cx:wall[prefix+' X (mm)'],cy:wall[prefix+' Y (mm)'],r:F*.6,fill:'#b18131',stroke:'#15304a','stroke-width':5,'data-wall-end':part});handle.addEventListener('pointerdown',e=>startDrag(e,part))}}}}

 if(wallStart)element('circle',{cx:wallStart.x,cy:wallStart.y,r:F*.4,fill:'#b18131'});
 if(!args.units.length&&args.mode!=='walls')element('text',{x:L/2,y:D/2,'text-anchor':'middle','font-size':F*2,fill:'#385b74'},'Drag a cabinet here from the library');
 for(let u of args.units){let row=drag&&drag.index===u.index?{...u.row,'X (mm)':drag.x,'Y (mm)':drag.y}:u.row,p=points(row),cx=p.reduce((s,a)=>s+a[0],0)/4,cy=p.reduce((s,a)=>s+a[1],0)/4;
 if(u.index===selected){for(let [a,b,value] of [[p[0],p[1],row['Width (mm)']],[p[1],p[2],row['Depth (mm)']]]){let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),ox=dy/len*F*1.7,oy=-dx/len*F*1.7;element('line',{x1:a[0]+ox,y1:a[1]+oy,x2:b[0]+ox,y2:b[1]+oy,stroke:'#173b57','stroke-width':3});for(let q of [a,b])element('line',{x1:q[0]+ox*.75,y1:q[1]+oy*.75,x2:q[0]+ox*1.25,y2:q[1]+oy*1.25,stroke:'#173b57','stroke-width':3});element('text',{x:(a[0]+b[0])/2+ox*1.6,y:(a[1]+b[1])/2+oy*1.6,'text-anchor':'middle','font-size':F*1.15,fill:'#173b57'},`${value} mm`)}}
 let color=u.row['Z (mm)']>0?'#d7e7f5':'#d5dfd4';let meta={};try{meta=JSON.parse(row['Design details']||'{}')}catch{}color=meta.materials?.[row.Type==='Worktop'?'Worktop':'Front']?.color||color;let group=document.createElementNS(ns,'g');svg.appendChild(group);let dx=row['X (mm)']-u.row['X (mm)'],dy=row['Y (mm)']-u.row['Y (mm)'];for(let shape of (u.polygons||[p])){let poly=element('polygon',{points:shape.map(([x,y])=>[x+dx,y+dy].join(',')).join(' '),fill:color,'fill-opacity':.85,class:'unit'+(selected===u.index?' selected':''),'data-index':u.index,'aria-label':row.Name});group.appendChild(poly)}let poly=group;
 element('text',{x:cx,y:cy-F*.4,'text-anchor':'middle','font-size':F*1.4},row.Name.length>14?row.Name.slice(0,13)+'…':row.Name);element('text',{x:cx,y:cy+F*1.1,'text-anchor':'middle','font-size':F*1.1},`${row['Width (mm)']} × ${row['Depth (mm)']}`);
 poly.addEventListener('pointerdown',e=>{if(pending)return;e.preventDefault();selected=u.index;svg.focus();let p=position(e);if(!args.locked)drag={index:u.index,startX:p.x,startY:p.y,baseX:row['X (mm)'],baseY:row['Y (mm)'],x:row['X (mm)'],y:row['Y (mm)'],pointer:e.pointerId};svg.setPointerCapture(e.pointerId);draw();buttons();document.getElementById('status').textContent=`Selected ${row.Name}${args.locked?' — approved and locked':''}`});}
 buttons();}
svg.addEventListener('pointerdown',e=>{if(args?.mode!=='walls'||wallTool!=='draw'||pending)return;e.preventDefault();let p=position(e),x=Math.round(p.x/10)*10,y=Math.round(p.y/10)*10;if(x<0||y<0||x>args.layout.length||y>args.layout.width)return;if(!wallStart){wallStart={x,y};draw();document.getElementById('status').textContent='Now click the wall end point.'}else{let start=wallStart;wallStart=null;send('wall_add',{x1:start.x,y1:start.y,x2:x,y2:y})}});
svg.addEventListener('pointermove',e=>{if(wallDrag){let p=position(e),dx=p.x-wallDrag.start.x,dy=p.y-wallDrag.start.y,o=wallDrag.original;wallDrag.preview={...o};for(let prefix of ['Start','End']){if(wallDrag.part==='move'||wallDrag.part.toLowerCase()===prefix.toLowerCase()){wallDrag.preview[prefix+' X (mm)']=Math.round((o[prefix+' X (mm)']+dx)*10)/10;wallDrag.preview[prefix+' Y (mm)']=Math.round((o[prefix+' Y (mm)']+dy)*10)/10}}draw();return;}if(args?.mode==='walls'&&wallStart){let p=position(e);draw();element('line',{x1:wallStart.x,y1:wallStart.y,x2:p.x,y2:p.y,stroke:'#b18131','stroke-width':args.layout.wall_thickness||110,'stroke-dasharray':'40 20'});return;}if(!drag)return;let p=position(e);drag.x=drag.baseX+p.x-drag.startX;drag.y=drag.baseY+p.y-drag.startY;draw();document.getElementById('status').textContent=`X ${drag.x.toFixed(1)} mm; Y ${drag.y.toFixed(1)} mm`});
svg.addEventListener('pointerup',e=>{if(wallDrag){let d=wallDrag;wallDrag=null;selected=d.index;let p=d.preview,o=d.original;if(d.part==='move'&&Math.hypot(p['Start X (mm)']-o['Start X (mm)'],p['Start Y (mm)']-o['Start Y (mm)'])<.01){send('wall_select');return}if(d.part==='move')send('wall_move',{dx:p['Start X (mm)']-o['Start X (mm)'],dy:p['Start Y (mm)']-o['Start Y (mm)']});else{let prefix=d.part==='start'?'Start':'End';send('wall_'+d.part,{x:p[prefix+' X (mm)'],y:p[prefix+' Y (mm)']})}return;}if(args?.mode==='walls')return;if(drag){let d=drag;drag=null;if(Math.hypot(d.x-d.baseX,d.y-d.baseY)>.01)send('move',{x:d.x,y:d.y});else send('select');}else if(selected!==null)send('select')});
svg.addEventListener('pointercancel',()=>{drag=null;wallDrag=null;draw()});
document.getElementById('rotate').onclick=()=>send('rotate');document.getElementById('delete').onclick=()=>{if(confirm('Delete the selected unit?'))send('delete')};
svg.addEventListener('keydown',e=>{let u=selectedRow();if(!u||args.locked||pending)return;let step=e.shiftKey?1:10,dx=0,dy=0;if(e.key==='ArrowLeft')dx=-step;if(e.key==='ArrowRight')dx=step;if(e.key==='ArrowUp')dy=-step;if(e.key==='ArrowDown')dy=step;if(dx||dy){e.preventDefault();send('move',{x:u.row['X (mm)']+dx,y:u.row['Y (mm)']+dy})}if(e.key.toLowerCase()==='r'){e.preventDefault();send('rotate')}});
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;args=e.data.args;selected=args.selected;pending=false;drag=null;palette();draw();document.getElementById('status').textContent=args.mode==='walls'?'Click a wall to select it. Correct its position above, or unlock it to drag. Gold marks the selected wall.':args.locked?'Approved layout — editing is locked.':'Select and drag a unit. Blue units are elevated cabinets. Snapping is checked when you release.';post('streamlit:setFrameHeight',{height:Math.ceil(document.body.scrollHeight)+4})});
window.addEventListener('resize',()=>{if(args){draw();post('streamlit:setFrameHeight',{height:Math.ceil(document.body.scrollHeight)+4})}});
post('streamlit:componentReady',{apiVersion:1});post('streamlit:setFrameHeight',{height:640});
</script></html>
